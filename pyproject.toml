[project]
name = "job-hunting-agent"
version = "0.1.0"
description = "个人求职 agent：岗位监控、JD 分析、简历定制、投递追踪、邮件处理、面试模拟"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agent = "jha.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jha = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
