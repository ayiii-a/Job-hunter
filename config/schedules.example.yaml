# 定时任务定义
#
# 为什么这些提示词要住在文件里，而不是写在 cron 命令行里：
# 任务提示词是【会改变 agent 行为的东西】。散在命令行参数里，改一次就没有历史——
# 你没法 diff、没法回滚，出问题也说不清「上周那个结果是哪一版跑出来的」。
# 这和 target_profile.yaml 决定过滤行为是同一条道理，见路线图 §0「行为落成工件」。
#
# 跑一个：  agent run --schedule daily-jobs
# 看全部：  agent schedules
#
# --- 字段 ---
#   task           要 agent 做什么。这是提示词本身，随便写多长
#   tools          【按名字收窄】可用工具。写错名字会直接报错，不会静默少给
#   permissions    【按权限档收窄】read / write / gated。和 tools 二选一
#   max_turns      最多几轮工具往返
#   max_llm_calls  预算硬上限，超了就停并汇报已完成的部分
#   allow_notify   本任务是否授权推送。外发不可撤回，必须在这里显式写
#   openclaw       （可选）OpenClaw 外壳怎么调度它，见文件末尾
#
# --- 收窄工具的意义 ---
# 省 token 只是顺带（实测 daily-jobs 每轮省约 1,500 tokens，月省 $2 出头）。
# 真正的收益是【爆炸半径】：抓岗位的任务在结构上够不着改投递状态的工具，
# 哪怕它被 JD 里的注入内容说服了。这是「工具即边界」用在任务粒度上。

schedules:

  # ---------------------------------------------------------------------
  # 每天 1–2 次。岗位发布后 48 小时内投递回复率明显更高，所以别设太稀。
  # ---------------------------------------------------------------------
  daily-jobs:
    task: |
      抓取所有启用的目标公司的新岗位，然后分析尚未分析过的岗位。
      分析完之后按匹配档位排序，给我一份简报：

      - strong_apply 和 apply 的岗位逐个列出：公司、职位、地点、薪资、链接
      - 有内推路径的排在最前面，并明确写出该找谁要内推
      - 每个岗位附一句为什么值得投，以及最主要的 gap
      - 最后说明抓取器有没有失败的源

      不要为了做匹配判断去逐条读 JD 全文——用 analyze_jobs，它在工具内部分析。
    tools:
      - list_companies
      - fetch_jobs
      - analyze_jobs
      - rank_jobs
      - list_contacts
      - get_fetch_health
      - send_notification
    max_turns: 8
    max_llm_calls: 20
    allow_notify: false        # 想让它自动推到 Discord 就改成 true
    openclaw:
      cron: "0 9 * * *"          # 每天 9:00
      model: claude-sonnet-5
    notes: "Phase 1 + Phase 2 的日常驱动"

  # ---------------------------------------------------------------------
  # 每周一次。刻意设成【只读】——复盘的价值在于你自己看见问题，
  # agent 顺手改掉了，你就失去了那次校准的机会。
  # ---------------------------------------------------------------------
  weekly-review:
    task: |
      做一次每周复盘，只看不改：

      - 本周抓了多少岗位、初筛留下多少、分析后各档位各多少
      - 投递记录的状态分布；有没有超过 14 天没动静的
      - 有没有投出去超过 24 小时还没收到确认邮件的
      - 抓取器有没有静默失败的源
      - 已生成但还没过审核门的简历版本

      最后给我三条最该采取的行动，按影响排序。不要恭维，直接说问题。
    permissions: [read]
    max_turns: 6
    max_llm_calls: 12
    openclaw:
      cron: "0 10 * * 0"         # 每周日 10:00
      model: claude-sonnet-5
    notes: "只读。发现问题交给人处理，不代劳"

  # ---------------------------------------------------------------------
  # 每天一次的邮件总结。面试邀请的【即时】提醒不走这里：
  # 由 agent mail sweep --push-alerts 每 1–2 小时跑一次——确定性代码，不经过模型。
  # 分类在工具内部做，邮件正文不进 agent 上下文。
  # agent 没有确认面试邀请的能力——那些进人工队列，由你跑 agent mail accept。
  # ---------------------------------------------------------------------
  email-sweep:
    task: |
      拉取新邮件并处理。然后简要告诉我：

      - 邮件检测上一次成功是什么时候；如果已经过期（get_fetch_health 的 mail.stale），放在第一行说
      - 自动写入了哪些（确认邮件、拒信）
      - 人工确认队列里有什么——offer、面试邀请、OA 放最前面，说清楚是哪家公司哪个岗位
      - 有没有投出去 24 小时还没收到确认邮件的

      你没有确认面试邀请的能力，也不需要去做——列出来，让我自己跑 agent mail accept。
    tools:
      - sweep_emails
      - list_email_queue
      - get_tracking
      - check_confirmations
      - get_fetch_health
    max_turns: 6
    max_llm_calls: 12
    openclaw:
      cron: "0 21 * * *"         # 每天 21:00
      model: claude-haiku-4-5
    notes: "Phase 5。只读邮箱，只自动写可纠正的事件"

  # ---------------------------------------------------------------------
  # 不定时。OpenClaw 的聊天入口：你在手机上问，它只读回答。
  # 只读是刻意的——这条路中间隔着一个模型，确认面试邀请、批准简历这类事回电脑上做。
  # ---------------------------------------------------------------------
  phone-query:
    task: |
      你在 Discord 私信里回答我关于求职进度的问题，只看不改。

      - 回答要短，手机上看得完：先给结论，再给数字
      - 提到投递或邮件时带上 id，方便我回电脑上处理
      - 需要确认面试邀请、批准简历、记录投递的，告诉我在电脑上跑哪条命令
    tools:
      - list_email_queue
      - get_tracking
      - list_applications
      - check_confirmations
      - rank_jobs
      - get_analysis
      - list_contacts
      - get_prep_pack
      - get_fetch_health
    max_turns: 4
    max_llm_calls: 6
    openclaw:
      chat: discord
      model: claude-haiku-4-5
    notes: "OpenClaw 聊天入口，不进 cron。只读"


# -------------------------------------------------------------------------
# OpenClaw 外壳（可选）。agent openclaw config 从这份文件生成 OpenClaw 配置，
# agent openclaw verify 检查你实际用的配置有没有被改松。
#
# 每个任务里的 openclaw 块决定外壳怎么调度它：
#   cron   五段 cron 表达式。用 isolated 会话 + light-context 跑，结果推给你
#   chat   绑定到聊天入口（目前只支持 discord），你发消息时才跑
#   model  外壳用哪个模型跑这个 agent，必须是 PRICING 里有的
# 没有 openclaw 块的任务不会出现在外壳里。
#
# 外壳拿到的工具 = 任务的 tools − GATED 工具。send_notification 永远不交给外壳：
# 推送由 cron 的 announce 发到固定收件人，不经过 agent 的工具调用。
# -------------------------------------------------------------------------
openclaw:
  mail_detect_every: 2h        # agent mail sweep --push-alerts 的频率
